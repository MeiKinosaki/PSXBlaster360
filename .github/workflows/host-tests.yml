name: Host tests

on:
  push:
    paths:
      - "include/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/host-tests.yml"
  pull_request:
    paths:
      - "include/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile CPU tests
        run: make build/test_cpu
      - name: Run CPU tests
        run: ./build/test_cpu

  memory:
    name: Memory unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile memory tests
        run: make build/test_memory
      - name: Run memory tests
        run: ./build/test_memory

  hardware:
    name: Bus and device tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile bus tests
        run: make build/test_bus
      - name: Run bus tests
        run: ./build/test_bus

  integration:
    name: Full system integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile and run complete host suite
        run: make clean host-test
